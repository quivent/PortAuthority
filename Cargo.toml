[package]
name = "port-authority"
version = "0.1.0"
edition = "2021"
authors = ["Josh Kornreich"]
description = "A CLI tool for managing subdomain-to-localhost port mappings"
license = "MIT"

[[bin]]
name = "port"
path = "src/main.rs"

[[bin]]
name = "port-authority"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
env_logger = "0.11"
log = "0.4"
serde_json = "1.0"
dialoguer = "0.11"
sudo = "0.6"
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
hyper-reverse-proxy = "0.5"
notify = "6.0"  # For filesystem watching (daemon auto-reload)
tokio-tungstenite = "0.21"  # For WebSocket health checks

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "resource"] }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

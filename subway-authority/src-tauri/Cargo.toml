[package]
name = "subway-authority"
version = "1.0.0"
description = "NYC Port Authority themed desktop application for port management"
authors = ["Josh Kornreich"]
license = "MIT"
repository = "https://github.com/yourusername/subway-authority"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
# Tauri core with system tray and notification support
tauri = { version = "1.4", features = [
    "system-tray",
    "notification-all",
    "fs-create-dir",
    "fs-read-file",
    "fs-write-file",
    "protocol-asset",
    "window-show",
    "window-hide",
    "window-close",
    "window-center",
    "window-set-focus",
    "window-set-title",
    "shell-open",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Thread-safe state management
parking_lot = "0.12"

# Native notifications (cross-platform)
notify-rust = "4.9"

# System interaction
open = "5.0"

# Unique identifiers
uuid = { version = "1.4", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Port Authority CLI integration (optional)
# Uncomment to use CLI functionality
# port-authority = { path = "../../", package = "port-authority" }

[features]
# By default, use all features
default = ["custom-protocol"]

# Custom protocol for production builds
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
